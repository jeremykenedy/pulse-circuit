<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Circuit</title>
  <desc id="desc">An animated geometric screensaver with no tracking or analytics.</desc>
  <defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs>
  <rect width="800" height="200" rx="16" fill="url(#background)"/>
  <text x="40" y="78" fill="#fff" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Pulse Circuit</text>
  <text x="42" y="108" fill="#a8a29e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">Luminous forms in continuous motion</text>
  <rect x="40" y="130" width="150" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/><text x="115" y="145" fill="#60a5fa" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" text-anchor="middle">NO TRACKING OR ANALYTICS</text>
